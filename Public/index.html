<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Presentation Squad - Web Portal</title>
    <style>
        body { font-family: monospace; background: #121212; color: #e0e0e0; text-align: center; padding: 50px; }
        input, button { padding: 10px; margin: 5px; background: #222; color: #ff4500; border: 1px solid #ff4500; font-family: monospace; }
        button:hover { background: #ff4500; color: #121212; cursor: pointer; }
        .box { border: 1px solid #333; padding: 30px; display: inline-block; background: #1a1a1a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>PRESENTATION SQUAD</h1>
        <p>Enter your Discord Channel / Room ID and Passkey to login:</p>
        <input type="text" id="roomId" placeholder="Room ID"><br>
        <input type="password" id="passkey" placeholder="Passkey / Password"><br>
        <button onclick="login()">Enter Session</button>
    </div>
    <script>
        function login() {
            const room = document.getElementById('roomId').value;
            const pass = document.getElementById('passkey').value;
            if(!room) { alert('Enter Room ID'); return; }
            window.location.href = `room.html?room=${room}&pass=${pass}`;
        }
    </script>
</body>
</html>
